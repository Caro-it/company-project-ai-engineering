[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-api"
version = "0.1.0"
description = "API de Nexova Solutions: incidencias y directorio de proveedores"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "tinydb>=4.8",
    "incidents-core",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.4",
    "pydantic-settings>=2.16.1",
    "email-validator>=2.3.0",
    "resend>=2.50.0",
]

[project.scripts]
seed = "app.seed:main"
create-admin = "app.create_admin:main"

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.uv.sources]
incidents-core = { path = "../../packages/incidents_core", editable = true }
