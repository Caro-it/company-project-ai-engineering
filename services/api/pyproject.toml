[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-api"
version = "0.1.0"
description = "API de Nexova Solutions: incidencias y directorio de proveedores"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "tinydb>=4.8",
    "incidents-core",
]

[project.scripts]
seed = "app.seed:main"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.uv.sources]
incidents-core = { path = "../../packages/incidents_core", editable = true }