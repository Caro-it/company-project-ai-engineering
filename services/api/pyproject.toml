[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-api"
version = "0.1.0"
description = "API de Nexova Solutions: incidencias, directorio de proveedores e inventario"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "tinydb>=4.8",
    "incidents-core",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.4",
    "pydantic-settings>=2.16.1",
    "email-validator>=2.3.0",
    "resend>=2.50.0",
    "sqlmodel>=0.0.48",
    "psycopg2-binary>=2.9.13",
]

[project.scripts]
seed = "app.seed:main"
create-admin = "app.create_admin:main"
seed-inventory = "app.seed_inventory:main"

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.uv.sources]
incidents-core = { path = "../../packages/shared/incidents_core", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
include = ["app/routers/auth.py", "app/deps.py", "app/security.py", "app/services/password_reset.py", "app/services/users.py"]
